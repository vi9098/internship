<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Pin & Cap Gold Accent Gradient -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Shimmer Glow -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container for App Icon -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" filter="url(#subtleGlow)"/>

  <!-- Subtle Outer Compass Navigation Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="6 4"/>
  
  <!-- Cardinal Directions Points (Compass Accent) -->
  <polygon points="100,16 103,24 97,24" fill="#fbbf24"/>
  <polygon points="100,184 103,176 97,176" fill="#ffffff" fill-opacity="0.5"/>
  <polygon points="16,100 24,97 24,103" fill="#ffffff" fill-opacity="0.5"/>
  <polygon points="184,100 176,97 176,103" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Location Pin / Pathway Base -->
  <path d="M100,38 C70,38 48,60 48,90 C48,128 100,168 100,168 C100,168 152,128 152,90 C152,60 130,38 100,38 Z"
        fill="#0f172a" fill-opacity="0.22"/>

  <!-- The Integrated Graduation Mortarboard Rhombus -->
  <polygon points="100,48 156,76 100,102 44,76" fill="url(#capGrad)" filter="url(#subtleGlow)"/>

  <!-- Graduation Cap Lower Skull Cap & Pathway Arc -->
  <path d="M64,88 L64,112 C64,128 136,128 136,112 L136,88 C124,98 112,102 100,102 C88,102 76,98 64,88 Z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- The Guiding Career Spark / North Star (Opportunity Beacon) -->
  <path d="M100,24 Q100,48 114,48 Q100,48 100,72 Q100,48 86,48 Q100,48 100,24 Z" fill="url(#goldSpark)"/>

  <!-- Central Search Lens / Focus Circle within Cap -->
  <circle cx="100" cy="76" r="10" fill="#2563eb"/>
  <circle cx="100" cy="76" r="5" fill="#fbbf24"/>

  <!-- Graduation Cap Tassel -->
  <path d="M150,78 Q156,92 154,116" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="154" cy="120" r="4.5" fill="#f59e0b"/>
</svg>
